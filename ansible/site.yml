---
- name: Configure home server
  hosts: homeserver
  become: true

  vars_files:
    - secrets.yml
    - vars/reporting.yml
    - vars/frigate.yml

  vars:
    reporting_generated_retention_days: 30
    reporting_published_retention_days: 7

  pre_tasks:
    - name: Validate Frigate prerequisites before changing the main stack
      ansible.builtin.import_tasks: tasks/frigate-preflight.yml

  tasks:
    - name: Install Tor
      ansible.builtin.apt:
        name: tor
        state: present
        update_cache: true

    - name: Enable and start Tor
      ansible.builtin.systemd:
        name: tor
        enabled: true
        state: started

    - name: Install Tor configuration
      ansible.builtin.template:
        src: torrc.j2
        dest: /etc/tor/torrc
        owner: root
        group: root
        mode: "0644"
        validate: "tor --verify-config --User debian-tor --DataDirectory /var/lib/tor -f %s"
      notify: Restart Tor

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Install Frigate Onion Nginx configuration
      ansible.builtin.template:
        src: frigate-onion-nginx.conf.j2
        dest: /etc/nginx/sites-available/frigate-onion
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx

    - name: Enable Frigate Onion Nginx configuration
      ansible.builtin.file:
        src: /etc/nginx/sites-available/frigate-onion
        dest: /etc/nginx/sites-enabled/frigate-onion
        state: link
      notify: Restart Nginx

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Create Home Assistant configuration directory
      ansible.builtin.file:
        path: /srv/homeassistant/config
        state: directory
        mode: "0755"

    - name: Create Mosquitto configuration directory
      ansible.builtin.file:
        path: /srv/mosquitto/config
        state: directory
        owner: root
        group: "{{ mosquitto_container_gid | default('1883') }}"
        mode: "0750"

    - name: Create Mosquitto data directory
      ansible.builtin.file:
        path: /srv/mosquitto/data
        state: directory
        mode: "0755"

    - name: Create InfluxDB data directory
      ansible.builtin.file:
        path: /srv/influxdb/data
        state: directory
        mode: "0755"

    - name: Create InfluxDB configuration directory
      ansible.builtin.file:
        path: /srv/influxdb/config
        state: directory
        mode: "0755"

    - name: Create secrets directory
      ansible.builtin.file:
        path: /srv/secrets
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create reporting application directory
      ansible.builtin.file:
        path: /srv/reporting/app
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create reporting output directory
      ansible.builtin.file:
        path: /srv/reporting/output
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create generated reporting directory
      ansible.builtin.file:
        path: /srv/reporting/output/generated
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create reporting publication queue directory
      ansible.builtin.file:
        path: /srv/reporting/output/publish_queue
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create published reporting directory
      ansible.builtin.file:
        path: /srv/reporting/output/published
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install reporting cleanup script
      ansible.builtin.template:
        src: reporting-cleanup.sh.j2
        dest: /usr/local/sbin/reporting-cleanup
        owner: root
        group: root
        mode: "0755"

    - name: Install reporting cleanup service
      ansible.builtin.template:
        src: reporting-cleanup.service.j2
        dest: /etc/systemd/system/reporting-cleanup.service
        owner: root
        group: root
        mode: "0644"

    - name: Install reporting cleanup timer
      ansible.builtin.template:
        src: reporting-cleanup.timer.j2
        dest: /etc/systemd/system/reporting-cleanup.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start reporting cleanup timer
      ansible.builtin.systemd:
        name: reporting-cleanup.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Install InfluxDB username secret
      ansible.builtin.copy:
        content: "{{ influxdb_username }}"
        dest: /srv/secrets/influxdb_username
        owner: root
        group: "{{ influxdb_container_gid | default('1000') }}"
        mode: "0640"
      no_log: true

    - name: Install InfluxDB password secret
      ansible.builtin.copy:
        content: "{{ influxdb_password }}"
        dest: /srv/secrets/influxdb_password
        owner: root
        group: "{{ influxdb_container_gid | default('1000') }}"
        mode: "0640"
      no_log: true

    - name: Check whether InfluxDB token exists
      ansible.builtin.stat:
        path: /srv/secrets/influxdb_token
      register: influxdb_token_file

    - name: Generate InfluxDB token
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -hex
          - "32"
      register: generated_influxdb_token
      changed_when: true
      no_log: true
      when: not influxdb_token_file.stat.exists

    - name: Save generated InfluxDB token
      ansible.builtin.copy:
        content: "{{ generated_influxdb_token.stdout }}"
        dest: /srv/secrets/influxdb_token
        owner: root
        group: "{{ influxdb_container_gid | default('1000') }}"
        mode: "0640"
      no_log: true
      when: not influxdb_token_file.stat.exists

    - name: Ensure InfluxDB token permissions
      ansible.builtin.file:
        path: /srv/secrets/influxdb_token
        owner: root
        group: "{{ influxdb_container_gid | default('1000') }}"
        mode: "0640"

    - name: Install Mosquitto configuration
      ansible.builtin.template:
        src: mosquitto.conf.j2
        dest: /srv/mosquitto/config/mosquitto.conf
        owner: root
        group: root
        mode: "0644"

    - name: Check whether Mosquitto password file exists
      ansible.builtin.stat:
        path: /srv/mosquitto/config/password_file
      register: mosquitto_password_file

    - name: Create Mosquitto password file
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - "0:0"
          - -v
          - /srv/mosquitto/config:/mosquitto/config
          - eclipse-mosquitto:2
          - mosquitto_passwd
          - -b
          - -c
          - /mosquitto/config/password_file
          - "{{ mqtt_username }}"
          - "{{ mqtt_password }}"
      no_log: true
      when: not mosquitto_password_file.stat.exists

    - name: Update Mosquitto password
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - "0:0"
          - -v
          - /srv/mosquitto/config:/mosquitto/config
          - eclipse-mosquitto:2
          - mosquitto_passwd
          - -b
          - /mosquitto/config/password_file
          - "{{ mqtt_username }}"
          - "{{ mqtt_password }}"
      no_log: true
      when: mosquitto_password_file.stat.exists

    - name: Set Mosquitto password file permissions
      ansible.builtin.file:
        path: /srv/mosquitto/config/password_file
        owner: root
        group: "{{ mosquitto_container_gid | default('1883') }}"
        mode: "0640"

    - name: Copy reporting application
      ansible.builtin.copy:
        src: ../reporting/
        dest: /srv/reporting/app/
        owner: root
        group: root
        directory_mode: "0755"

    - name: Ensure reporting entrypoint is executable
      ansible.builtin.file:
        path: /srv/reporting/app/entrypoint.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install Docker Compose configuration
      ansible.builtin.template:
        src: compose.yml.j2
        dest: /srv/compose.yml
        owner: root
        group: root
        mode: "0644"

    - name: Build reporting image
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /srv/compose.yml
          - build
          - reporting
      changed_when: true

    - name: Start infrastructure containers
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /srv/compose.yml
          - up
          - -d
          - --pull
          - always
          - --remove-orphans
      changed_when: true

    - name: Ensure reporting audit bucket exists
      ansible.builtin.shell: |
        set -eu

        if docker exec influxdb sh -c '
          influx bucket list \
            --host http://localhost:8086 \
            --org home \
            --token "$(cat /run/secrets/influxdb_token)" \
            --name reporting_audit \
            --json
        ' | grep -Eq '"name"[[:space:]]*:[[:space:]]*"reporting_audit"'
        then
          echo "EXISTS"
        else
          docker exec influxdb sh -c '
            influx bucket create \
              --host http://localhost:8086 \
              --org home \
              --token "$(cat /run/secrets/influxdb_token)" \
              --name reporting_audit
          '
          echo "CREATED"
        fi
      args:
        executable: /bin/bash
      register: reporting_audit_bucket
      changed_when: "'CREATED' in reporting_audit_bucket.stdout"

  handlers:
    - name: Restart Tor
      ansible.builtin.systemd:
        name: tor
        state: restarted

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true

- name: Deploy the Frigate CCTV stack
  ansible.builtin.import_playbook: frigate.yml
