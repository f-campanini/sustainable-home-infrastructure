---
- name: Manage the Frigate CCTV stack
  hosts: homeserver
  become: true
  tags: [frigate]

  vars_files:
    - vars/frigate.yml

  pre_tasks:
    - name: Validate private Frigate prerequisites
      ansible.builtin.import_tasks: tasks/frigate-preflight.yml

  tasks:
    - name: Create Frigate persistent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /srv/frigate
        - /srv/frigate/config
        - /srv/frigate/media

    - name: Check whether the Frigate image is available
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ frigate_image }}"]
      register: frigate_image_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Pull the Frigate image when absent
      ansible.builtin.command:
        argv: [docker, pull, "{{ frigate_image }}"]
      when: frigate_image_check.rc != 0
      changed_when: true

    - name: Install and validate Frigate configuration
      ansible.builtin.template:
        src: frigate-config.yml.j2
        dest: /srv/frigate/config/config.yml
        owner: root
        group: root
        mode: "0600"
        validate: >-
          docker run --rm --network none --pull never
          --volume %s:/config/config.yml:ro
          --entrypoint python3 {{ frigate_image }}
          -c "from pathlib import Path; from frigate.config import FrigateConfig; FrigateConfig.parse_yaml(Path('/config/config.yml').read_text(), install=False)"
      register: frigate_configuration
      no_log: true
      diff: false

    - name: Install and validate Frigate Compose configuration
      ansible.builtin.template:
        src: frigate-compose.yml.j2
        dest: /srv/frigate/compose.yml
        owner: root
        group: root
        mode: "0644"
        validate: docker compose --project-name frigate --file %s config --quiet

    - name: Read the existing Frigate container identity
      ansible.builtin.command:
        argv: [docker, compose, --project-name, frigate, --file, /srv/frigate/compose.yml, ps, --all, --quiet, frigate]
      register: frigate_container_before
      changed_when: false
      when: not ansible_check_mode

    - name: Reconcile the Frigate Compose service
      ansible.builtin.command:
        argv: [docker, compose, --project-name, frigate, --file, /srv/frigate/compose.yml, up, --detach, --pull, never, frigate]
      register: frigate_compose_up
      changed_when: >-
        'Created' in frigate_compose_up.stderr or
        'Recreated' in frigate_compose_up.stderr or
        'Started' in frigate_compose_up.stderr
      when: not ansible_check_mode

    - name: Read the resulting Frigate container identity
      ansible.builtin.command:
        argv: [docker, compose, --project-name, frigate, --file, /srv/frigate/compose.yml, ps, --all, --quiet, frigate]
      register: frigate_container_after
      changed_when: false
      when: not ansible_check_mode

    - name: Restart an existing container after configuration changes
      ansible.builtin.command:
        argv: [docker, compose, --project-name, frigate, --file, /srv/frigate/compose.yml, restart, frigate]
      changed_when: true
      when:
        - not ansible_check_mode
        - frigate_configuration.changed
        - frigate_container_before.stdout | length > 0
        - frigate_container_before.stdout == frigate_container_after.stdout

    - name: Wait for the Frigate container to become healthy
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{% raw %}{{.State.Health.Status}}{% endraw %}", frigate]
      register: frigate_health
      changed_when: false
      until: frigate_health.rc == 0 and frigate_health.stdout == 'healthy'
      retries: 30
      delay: 10
      when: not ansible_check_mode
