<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Home Energy History</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .controls {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        select,
        button {
            padding: 8px;
            font-size: 1rem;
        }

        button {
            cursor: pointer;
            align-self: end;
        }

        #message {
            margin: 15px 0;
            font-weight: 600;
        }

        #queryId {
            margin: 10px 0;
            font-size: 0.9rem;
        }

        #chart {
            display: none;
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }

        #technicalDetails {
            display: none;
            margin-top: 20px;
        }

        #technicalDetails pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            padding: 15px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<h1>Home Energy History</h1>

<div class="controls">

    <label>
        Measurement
        <select id="measurement">
            {% for value, label in measurements.items() %}
            <option value="{{ value }}">
                {{ label }}
            </option>
            {% endfor %}
        </select>
    </label>

    <label>
        Entity
        <select id="entity"></select>
    </label>

    <label>
        Period
        <select id="range">
            <option value="24h">24 hours</option>
            <option value="48h">48 hours</option>
            <option value="7d">7 days</option>
            <option value="30d">30 days</option>
            <option value="90d">90 days</option>
        </select>
    </label>

    <label>
        Aggregation
        <select id="aggregation">
            <option value="raw">Raw</option>
            <option value="5m">5 minutes</option>
            <option value="15m">15 minutes</option>
            <option value="1h">Hourly</option>
            <option value="1d">Daily</option>
        </select>
    </label>

    <label>
        Function
        <select id="function">
            <option value="mean">Average</option>
            <option value="min">Minimum</option>
            <option value="max">Maximum</option>
            <option value="sum">Sum</option>
        </select>
    </label>

    <label>
        Chart
        <select id="chartType">
            <option value="line">Line</option>
            <option value="bar">Bar</option>
        </select>
    </label>

    <button id="generate">
        Generate graph
    </button>

</div>

<div id="message"></div>
<div id="queryId"></div>

<details id="technicalDetails">
    <summary>Technical details</summary>
    <pre id="technicalText"></pre>
</details>

<img
    id="chart"
    alt="Historical graph"
>

<script>
const measurement =
    document.getElementById("measurement");

const entity =
    document.getElementById("entity");

const range =
    document.getElementById("range");

const aggregation =
    document.getElementById("aggregation");

const func =
    document.getElementById("function");

const chartType =
    document.getElementById("chartType");

const generate =
    document.getElementById("generate");

const chart =
    document.getElementById("chart");

const message =
    document.getElementById("message");

const queryId =
    document.getElementById("queryId");

const technicalDetails =
    document.getElementById("technicalDetails");

const technicalText =
    document.getElementById("technicalText");


function clearResult() {
    message.textContent = "";
    queryId.textContent = "";

    technicalDetails.style.display = "none";
    technicalDetails.open = false;
    technicalText.textContent = "";

    chart.style.display = "none";
}


function showError(data) {
    message.textContent =
        data.message ||
        "The request could not be completed.";

    if (data.query_id) {
        queryId.textContent =
            "Query: " + data.query_id;
    }

    if (data.details) {
        technicalText.textContent =
            data.details;

        technicalDetails.style.display =
            "block";
    }
}


async function loadEntities() {
    clearResult();

    message.textContent =
        "Loading sensors...";

    entity.innerHTML = "";

    try {
        const response = await fetch(
            "/api/entities?measurement=" +
            encodeURIComponent(
                measurement.value
            )
        );

        const data = await response.json();

        if (!data.ok) {
            showError(data);
            return;
        }

        for (const value of data.entities) {
            const option =
                document.createElement(
                    "option"
                );

            option.value = value;
            option.textContent = value;

            entity.appendChild(option);
        }

        if (data.entities.length === 0) {
            message.textContent =
                "No sensors were found for "
                + "this measurement.";
        } else {
            message.textContent = "";
        }

    } catch (error) {
        showError({
            message:
                "Unable to load the sensor list.",
            details:
                error.stack || error.toString(),
        });
    }
}


async function generateChart() {
    clearResult();

    message.textContent =
        "Generating graph...";

    const params = new URLSearchParams({
        measurement:
            measurement.value,

        entity_id:
            entity.value,

        range:
            range.value,

        aggregation:
            aggregation.value,

        function:
            func.value,

        chart_type:
            chartType.value,
    });

    try {
        const response = await fetch(
            "/chart?" + params
        );

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";

        if (
            contentType.includes(
                "application/json"
            )
        ) {
            const data =
                await response.json();

            showError(data);
            return;
        }

        const blob =
            await response.blob();

        if (chart.src) {
            URL.revokeObjectURL(
                chart.src
            );
        }

        chart.src =
            URL.createObjectURL(blob);

        chart.style.display =
            "block";

        const id =
            response.headers.get(
                "X-Query-ID"
            );

        message.textContent =
            "Graph generated successfully.";

        if (id) {
            queryId.textContent =
                "Query: " + id;
        }

    } catch (error) {
        showError({
            message:
                "Unable to generate the graph.",
            details:
                error.stack || error.toString(),
        });
    }
}


measurement.addEventListener(
    "change",
    loadEntities
);

generate.addEventListener(
    "click",
    generateChart
);

loadEntities();
</script>

</body>
</html>
